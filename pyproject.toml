[project]
name = "modal-devin"
version = "0.1.13"
description = "Run Devin Outposts workers on Modal"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Adam Azzam", email = "33043305+aaazzam@users.noreply.github.com" },
]
keywords = ["devin", "modal", "outposts", "workers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "modal>=1.5.1,<2",
    "cyclopts>=4.20",
    "logfire>=4.2,<5",
    "rich>=13.6",
]

[project.urls]
Repository = "https://github.com/aaazzam/modal-devin"
Issues = "https://github.com/aaazzam/modal-devin/issues"
Changelog = "https://github.com/aaazzam/modal-devin/blob/main/CHANGELOG.md"
Documentation = "https://modal.com/docs/devin"

[project.scripts]
modal-devin = "modal_devin.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modal_devin"]

[dependency-groups]
dev = [
    "coverage[toml]>=7.10",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "ty>=0.0.57",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
markers = [
    "integration: opt-in checks that create ephemeral resources in a Modal workspace",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["modal_devin"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
allowed-confusables = ["›"]
select = ["ANN", "B", "C4", "E", "F", "I", "LOG", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]
